<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6c2cf" />
  <title>Clara Alice | Meus links</title>
  <style>
    :root {
      --bg1:#e8a4b3;
      --bg2:#f8d6df;
      --bg3:#f1bcc8;
      --pink:#ea4f8f;
      --pink-dark:#c92f72;
      --pink-soft:#ffecf4;
      --shadow: rgba(214,63,126,.18);
      --shadow-strong: rgba(214,63,126,.28);
      --text:#ffffff;
    }

    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; }
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 54%, var(--bg3) 100%);
      overflow-x: hidden;
    }

    .site {
      position: relative;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 18px 80px;
      overflow: hidden;
      isolation: isolate;
    }

    .bg-glow, .bg-glow::before, .bg-glow::after {
      position:absolute;
      inset:auto;
      border-radius:50%;
      pointer-events:none;
      content:"";
      filter: blur(10px);
      z-index:0;
    }
    .bg-glow {
      width:220px; height:220px;
      left:-60px; top:120px;
      background: radial-gradient(circle, rgba(255,255,255,.25) 0%, rgba(255,255,255,0) 70%);
      animation: drift 14s ease-in-out infinite;
    }
    .bg-glow::before {
      width:260px; height:260px; left:calc(100vw - 180px); top:220px;
      background: radial-gradient(circle, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 68%);
      animation: drift 18s ease-in-out infinite reverse;
    }
    .bg-glow::after {
      width:180px; height:180px; left:35vw; bottom:80px;
      background: radial-gradient(circle, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 70%);
      animation: drift 16s ease-in-out infinite;
    }

    .content {
      width: min(100%, 460px);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      animation: introUp .9s cubic-bezier(.2,.9,.2,1) both;
    }

    .avatar-frame {
      width: 124px;
      height: 124px;
      padding: 4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff7abc, #ff4b9b);
      box-shadow: 0 10px 28px rgba(214,63,126,.25);
      position: relative;
      margin-top: 8px;
      animation: avatarFloat 4.2s ease-in-out infinite;
    }

    .avatar-frame::before {
      content:"";
      position:absolute;
      inset:-6px;
      border-radius:50%;
      border: 2px solid rgba(255,255,255,.28);
      animation: ringPulse 2.8s ease-in-out infinite;
    }

    .avatar {
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center 24%;
      border-radius:50%;
      border:4px solid rgba(255,255,255,.88);
      background:#fff;
    }

    .online {
      position:absolute;
      right:4px;
      bottom:7px;
      width:24px;
      height:24px;
      border-radius:50%;
      background:#39d784;
      border:3px solid #fff;
      box-shadow:0 0 0 0 rgba(57,215,132,.5);
      animation: onlinePing 2.2s infinite;
    }

    h1 {
      margin: 16px 0 0;
      font-size: 26px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -.5px;
      text-align: center;
      text-shadow: 0 1px 1px rgba(0,0,0,.06);
      animation: introUp 1s .08s cubic-bezier(.2,.9,.2,1) both;
    }

    .bio {
      margin: 16px 0 24px;
      font-size: 16px;
      font-weight: 600;
      color: #d72d71;
      text-align: center;
      animation: introUp 1s .16s cubic-bezier(.2,.9,.2,1) both;
    }

    .links {
      width:100%;
      display:grid;
      gap:16px;
    }

    .link {
      position:relative;
      overflow:hidden;
      display:flex;
      align-items:center;
      gap:14px;
      width:100%;
      min-height:84px;
      padding:14px 22px;
      border-radius:999px;
      text-decoration:none;
      color:var(--pink);
      background:rgba(255,255,255,.94);
      border:2px solid rgba(255,255,255,.76);
      box-shadow:0 10px 22px var(--shadow), inset 0 0 0 1px rgba(245,235,239,.98);
      transition:transform .28s ease, box-shadow .28s ease, background .28s ease;
      will-change:transform, box-shadow;
      animation: linkEntry .8s cubic-bezier(.2,.9,.2,1) both, pulseSoft 2.6s ease-in-out infinite;
    }
    .link:nth-child(1) { animation-delay: .24s, .2s; }
    .link:nth-child(2) { animation-delay: .38s, .9s; }

    .link::before {
      content:"";
      position:absolute;
      top:0;
      left:-120%;
      width:55%;
      height:100%;
      background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.65) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-20deg);
      animation: shimmer 3.8s linear infinite;
      pointer-events:none;
    }

    .link:nth-child(2)::before { animation-delay: 1.2s; }

    .link:hover {
      transform: translateY(-5px) scale(1.018);
      background:#fff;
      box-shadow:0 18px 30px var(--shadow-strong), inset 0 0 0 1px rgba(245,235,239,.99);
    }

    .link:focus-visible { outline:3px solid #c2296a; outline-offset:4px; }

    .link-icon {
      flex:0 0 50px;
      height:50px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:#ffe7f0;
      color:#ef4a8b;
      box-shadow: inset 0 0 0 1px rgba(233,164,192,.35);
      transform: translateZ(0);
    }

    .link-icon svg { width:27px; height:27px; }

    .link-title {
      flex:1;
      text-align:left;
      font-size:18px;
      font-weight:800;
      letter-spacing:.15px;
    }

    .pill {
      flex-shrink:0;
      padding:6px 12px;
      border-radius:999px;
      color:#fff;
      font-size:12px;
      font-weight:800;
      background:linear-gradient(90deg,#ff5b95,#ef3a7f);
      box-shadow:0 3px 10px rgba(239,58,127,.25);
      animation: pillBounce 2.8s ease-in-out infinite;
    }

    .pill.blue {
      background:linear-gradient(90deg,#5eb6ff,#347cff);
      box-shadow:0 3px 10px rgba(52,124,255,.25);
    }

    .heart {
      position:absolute;
      bottom:-60px;
      z-index:0;
      color:#ea5a84;
      user-select:none;
      pointer-events:none;
      opacity:0;
      filter: drop-shadow(0 2px 2px rgba(104,50,67,.28));
      animation-name: heartRise;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform, opacity;
    }
    .h1 { left:3%;  font-size:16px; animation-duration:11s;   animation-delay:-1s; }
    .h2 { left:15%; font-size:30px; animation-duration:14s;   animation-delay:-5s; }
    .h3 { left:28%; font-size:22px; animation-duration:12.2s; animation-delay:-2.2s; }
    .h4 { left:42%; font-size:18px; animation-duration:15.5s; animation-delay:-9s; }
    .h5 { left:58%; font-size:28px; animation-duration:13.2s; animation-delay:-4.8s; }
    .h6 { left:73%; font-size:20px; animation-duration:12.4s; animation-delay:-7s; }
    .h7 { left:86%; font-size:26px; animation-duration:16s;   animation-delay:-2.6s; }
    .h8 { left:50%; font-size:14px; animation-duration:10.8s; animation-delay:-6.2s; }
    .h9 { left:9%;  font-size:13px; animation-duration:13.8s; animation-delay:-8.7s; }
    .h10{ left:67%; font-size:15px; animation-duration:11.6s; animation-delay:-3.4s; }

    .modal {
      position:fixed;
      inset:0;
      display:none;
      justify-content:center;
      align-items:center;
      padding:20px;
      background:rgba(98,26,58,.45);
      z-index:20;
      backdrop-filter: blur(4px);
    }
    .modal.open { display:flex; }
    .modal-box {
      width:min(100%,360px);
      background:#fff;
      color:#7c3556;
      border-radius:24px;
      padding:28px;
      text-align:center;
      box-shadow:0 25px 70px rgba(84,24,49,.28);
      animation: popIn .25s ease-out;
    }
    .modal-box p { line-height:1.6; margin:8px 0 18px; }
    .modal-box button {
      border:none;
      border-radius:999px;
      background:linear-gradient(90deg,#ff5b95,#ef3a7f);
      color:#fff;
      padding:12px 28px;
      font-weight:800;
      cursor:pointer;
    }

    @keyframes introUp {
      from { opacity:0; transform: translateY(22px); }
      to   { opacity:1; transform: translateY(0); }
    }
    @keyframes linkEntry {
      from { opacity:0; transform: translateY(24px) scale(.97); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }
    @keyframes pulseSoft {
      0%,100% { transform: scale(1); box-shadow:0 10px 22px var(--shadow), inset 0 0 0 1px rgba(245,235,239,.98); }
      50% { transform: scale(1.024); box-shadow:0 16px 28px rgba(214,63,126,.23), inset 0 0 0 1px rgba(245,235,239,.99); }
    }
    @keyframes shimmer {
      0% { left:-120%; }
      60%, 100% { left:140%; }
    }
    @keyframes avatarFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes ringPulse {
      0%,100% { transform:scale(1); opacity:.55; }
      50% { transform:scale(1.04); opacity:.95; }
    }
    @keyframes onlinePing {
      0%   { box-shadow:0 0 0 0 rgba(57,215,132,.55); }
      70%  { box-shadow:0 0 0 10px rgba(57,215,132,0); }
      100% { box-shadow:0 0 0 0 rgba(57,215,132,0); }
    }
    @keyframes pillBounce {
      0%,100% { transform:translateY(0); }
      50% { transform:translateY(-2px); }
    }
    @keyframes heartRise {
      0%   { transform:translate3d(0,0,0) scale(.72) rotate(0deg); opacity:0; }
      10%  { opacity:.8; }
      35%  { transform:translate3d(8px,-32vh,0) scale(.9) rotate(9deg); opacity:.65; }
      70%  { transform:translate3d(-12px,-72vh,0) scale(1.04) rotate(-8deg); opacity:.48; }
      100% { transform:translate3d(6px,-115vh,0) scale(1.12) rotate(10deg); opacity:0; }
    }
    @keyframes drift {
      0%,100% { transform: translate(0,0); }
      50% { transform: translate(18px,-20px); }
    }
    @keyframes popIn {
      from { opacity:0; transform:scale(.95); }
      to { opacity:1; transform:scale(1); }
    }

    @media (max-width:520px) {
      .site { padding-top:32px; }
      .avatar-frame { width:114px; height:114px; }
      h1 { font-size:22px; }
      .bio { font-size:15px; margin-bottom:20px; }
      .link { min-height:78px; padding:12px 16px; }
      .link-title { font-size:15px; }
      .pill { font-size:11px; padding:5px 10px; }
    }

    @media (prefers-reduced-motion:reduce) {
      *, *::before, *::after { animation:none !important; transition:none !important; }
    }
  </style>
</head>

  <script>
    const LINKS = {
      grupoPrevias: "https://t.me/Anaallicebot?",
      converseComigo: ""
    };

    const modal = document.getElementById('modal');
    function setup(id, url) {
      const el = document.getElementById(id);
      if (url && /^https:\/\//i.test(url)) {
        el.href = url;
      } else {
        el.removeAttribute('target');
        el.addEventListener('click', (e) => {
          e.preventDefault();
          modal.classList.add('open');
          document.getElementById('close-modal').focus();
        });
      }
    }
    setup('grupo', LINKS.grupoPrevias);
    // O botão do WhatsApp permanece visível, mas sem link nem ação de clique.
    const whatsappButton = document.getElementById('conversa');
    whatsappButton.removeAttribute('href');
    whatsappButton.removeAttribute('target');
    whatsappButton.removeAttribute('rel');
    whatsappButton.style.cursor = 'default';

    document.getElementById('close-modal').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });
  </script>
